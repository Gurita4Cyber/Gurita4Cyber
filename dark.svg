<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <style>
      .pill { transition: all 0.3s ease; cursor: default; }
      .pill:hover { transform: scale(1.05); filter: brightness(1.3) drop-shadow(0 0 6px rgba(34, 211, 238, 0.6)); }
      .social-icon { transition: all 0.3s ease; cursor: pointer; }
      .social-icon:hover { transform: scale(1.1); filter: brightness(1.5) drop-shadow(0 0 8px rgba(124, 58, 237, 0.8)); }
      .glass-panel { transition: border 0.3s ease; }
      .glass-panel:hover { stroke: rgba(255,255,255,0.2); }
    </style>

    <!-- Background & Glass Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <!-- Typing Clip Paths for 5 Roles (3s per role = 15s total) -->
    <clipPath id="typingClip1">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 380; 380; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="15s" repeatCount="indefinite" begin="0s" />
      </rect>
    </clipPath>
    <clipPath id="typingClip2">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 380; 380; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="15s" repeatCount="indefinite" begin="3s" />
      </rect>
    </clipPath>
    <clipPath id="typingClip3">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 380; 380; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="15s" repeatCount="indefinite" begin="6s" />
      </rect>
    </clipPath>
    <clipPath id="typingClip4">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 380; 380; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="15s" repeatCount="indefinite" begin="9s" />
      </rect>
    </clipPath>
    <clipPath id="typingClip5">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 380; 380; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="15s" repeatCount="indefinite" begin="12s" />
      </rect>
    </clipPath>

    <!-- UI Elements -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Pattern for ASCII -->
    <pattern id="asciiPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <text x="0" y="20" font-family="monospace" font-size="14" fill="url(#accentGlow)" opacity="0.7">
        01001100 01101001 01101110
      </text>
      <text x="0" y="40" font-family="monospace" font-size="14" fill="url(#accentGlow)" opacity="0.5">
        01110101 01111000 00100000
      </text>
      <text x="0" y="60" font-family="monospace" font-size="14" fill="url(#accentGlow)" opacity="0.9">
        / / CLOUD &amp; DEVOPS / /
      </text>
      <text x="0" y="80" font-family="monospace" font-size="14" fill="url(#accentGlow)" opacity="0.6">
        01010011 01111001 01110011
      </text>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#030712" rx="20" />
  <rect width="100%" height="100%" fill="url(#bgGlow)" rx="20" />
  
  <!-- Subtle Grid/Noise overlay -->
  <rect width="100%" height="100%" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" stroke-dasharray="20 20" />
  
  <!-- Moving Particles (Micro Animation) -->
  <circle cx="100" cy="500" r="2" fill="#22D3EE" opacity="0.5">
    <animate attributeName="cy" values="500; 100" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.5; 0" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="600" r="1.5" fill="#10B981" opacity="0.3">
    <animate attributeName="cy" values="600; 200" dur="15s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.6; 0" dur="15s" repeatCount="indefinite" />
  </circle>

  <!-- LEFT PANEL: ASCII & Floating Elements (38%) -->
  <g transform="translate(40, 40)">
    <g>
      <!-- Floating animation wrapper -->
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="6s" repeatCount="indefinite" />
      
      <!-- Glass Panel -->
      <rect class="glass-panel" width="400" height="530" fill="#0F172A" rx="16" stroke="rgba(255,255,255,0.08)" filter="url(#dropShadow)" />
      
      <!-- ASCII Artwork Display -->
      <g transform="translate(30, 50)">
        <rect width="340" height="430" fill="url(#asciiPattern)">
           <animate attributeName="height" values="0; 430" dur="2s" fill="freeze" />
        </rect>
        
        <!-- Scanline -->
        <rect width="340" height="4" fill="#22D3EE" opacity="0.5">
          <animate attributeName="y" values="0; 430; 0" dur="4s" repeatCount="indefinite" />
        </rect>
      </g>
      
      <!-- Border Shimmer -->
      <rect width="400" height="530" fill="none" stroke="url(#accentGlow)" stroke-width="2" rx="16" opacity="0.3">
        <animate attributeName="opacity" values="0.1; 0.6; 0.1" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- RIGHT PANEL: Profile Information -->
  <g transform="translate(480, 40)">
    <!-- Greeting -->
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#F8FAFC">
      Hi 👋 I'm Firman Nabawi <tspan fill="#94A3B8" font-size="24">(Iman Linuxs)</tspan>
    </text>

    <!-- Typing Roles Container -->
    <g transform="translate(0, 80)" font-family="monospace" font-size="22" font-weight="600" fill="url(#accentGlow)">
      <text x="0" y="20" clip-path="url(#typingClip1)">> Software Engineer</text>
      <text x="0" y="20" clip-path="url(#typingClip2)">> Full Stack Developer</text>
      <text x="0" y="20" clip-path="url(#typingClip3)">> Linux &amp; DevOps Specialist</text>
      <text x="0" y="20" clip-path="url(#typingClip4)">> Open Source Contributor</text>
      <text x="0" y="20" clip-path="url(#typingClip5)">> AI Explorer</text>
      
      <!-- Blinking Cursor -->
      <rect x="375" y="2" width="10" height="22" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Details Section -->
    <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze" />
        <text x="0" y="0"><tspan fill="#F8FAFC" font-weight="600">Location:</tspan> Indonesia</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="1s" begin="1.0s" fill="freeze" />
        <text x="0" y="30"><tspan fill="#F8FAFC" font-weight="600">Education:</tspan> Computer Science / Information Technology</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="1s" begin="1.5s" fill="freeze" />
        <text x="0" y="60"><tspan fill="#F8FAFC" font-weight="600">Current Focus:</tspan> Building Modern Web Applications &amp; Cloud Infrastructure</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="1s" begin="2.0s" fill="freeze" />
        <text x="0" y="90"><tspan fill="#F8FAFC" font-weight="600">Email:</tspan> student.linuxs@gmail.com</text>
      </g>
    </g>

    <!-- Skills Section (Glowing Pills) -->
    <g transform="translate(0, 310)" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1s" begin="2.5s" fill="freeze" />
      
      <!-- Row 1 -->
      <g transform="translate(0, 0)" class="pill">
        <rect width="70" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="35" y="21" text-anchor="middle">Linux</text>
      </g>
      <g transform="translate(85, 0)" class="pill">
        <rect width="105" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="52.5" y="21" text-anchor="middle">Bash/Shell</text>
      </g>
      <g transform="translate(205, 0)" class="pill">
        <rect width="75" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="37.5" y="21" text-anchor="middle">React</text>
      </g>
      <g transform="translate(295, 0)" class="pill">
        <rect width="85" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="42.5" y="21" text-anchor="middle">Next.js</text>
      </g>
      <g transform="translate(395, 0)" class="pill">
        <rect width="85" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="42.5" y="21" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(495, 0)" class="pill">
        <rect width="100" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="50" y="21" text-anchor="middle">TypeScript</text>
      </g>
      
      <!-- Row 2 -->
      <g transform="translate(0, 45)" class="pill">
        <rect width="90" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="45" y="21" text-anchor="middle">Tailwind</text>
      </g>
      <g transform="translate(105, 45)" class="pill">
        <rect width="80" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="40" y="21" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(200, 45)" class="pill">
        <rect width="80" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="40" y="21" text-anchor="middle">Docker</text>
      </g>
      <g transform="translate(295, 45)" class="pill">
        <rect width="110" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="55" y="21" text-anchor="middle">PostgreSQL</text>
      </g>
      <g transform="translate(420, 45)" class="pill">
        <rect width="60" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="30" y="21" text-anchor="middle">AWS</text>
      </g>
      <g transform="translate(495, 45)" class="pill">
        <rect width="60" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
        <text x="30" y="21" text-anchor="middle">Git</text>
      </g>
    </g>
    
    <!-- Social Icons Container (Animated Minimal Glowing Icons) -->
    <g transform="translate(0, 415)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1s" begin="3s" fill="freeze" />
      <g class="social-icon" transform="translate(0, 0)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
        <text x="16" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#22D3EE" text-anchor="middle" font-weight="bold">GH</text>
      </g>
      <g class="social-icon" transform="translate(45, 0)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
        <text x="16" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#22D3EE" text-anchor="middle" font-weight="bold">IN</text>
      </g>
      <g class="social-icon" transform="translate(90, 0)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
        <text x="16" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#22D3EE" text-anchor="middle" font-weight="bold">TW</text>
      </g>
    </g>

    <!-- Decorative glowing line at bottom -->
    <rect x="0" y="490" width="600" height="2" fill="url(#accentGlow)" opacity="0.3">
       <animate attributeName="width" values="0; 600" dur="2s" fill="freeze" />
    </rect>
  </g>
</svg>
